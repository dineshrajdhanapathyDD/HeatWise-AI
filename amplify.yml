# AWS Amplify Hosting build spec for the HeatWise AI dashboard (React + Vite in heatwise-ai/frontend/).
# Lives at the repository root. Monorepo format: appRoot must equal the AMPLIFY_MONOREPO_APP_ROOT
# environment variable (heatwise-ai/frontend).
# Set VITE_API_BASE_URL in the Amplify console (environment variables); Vite reads it at build time.
version: 1
applications:
  - appRoot: heatwise-ai/frontend
    frontend:
      phases:
        preBuild:
          commands:
            - nvm install 22
            - node --version
            - npm ci
        build:
          commands:
            - test -n "$VITE_API_BASE_URL" || (echo "VITE_API_BASE_URL is not set" && exit 1)
            - npm run build
      artifacts:
        baseDirectory: dist
        files:
          - "**/*"
      cache:
        paths:
          - node_modules/**/*
