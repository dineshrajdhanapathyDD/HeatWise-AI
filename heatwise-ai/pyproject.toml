[project]
name = "heatwise-ai"
version = "0.1.0"
description = "HeatWise AI - multi-agent community heatwave preparedness assistant built with the Strands Agents SDK"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "strands-agents==1.63.0",
    "fastapi==0.162.0",
    "pydantic==2.14.2",
    "pydantic-settings==2.16.2",
    "httpx==0.28.1",
    "boto3==1.43.123",
    "uvicorn==0.54.0",
    "mangum==0.22.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*"]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
    "respx==0.23.1",
    "moto==5.2.5",
    "strands-agents-evals==1.8.0",
]
eval = ["strands-agents-evals==1.8.0"]
agentcore = ["bedrock-agentcore==1.25.2"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live: calls real external services (Open-Meteo, Amazon Bedrock); run with -m live",
]
addopts = "-m 'not live'"
